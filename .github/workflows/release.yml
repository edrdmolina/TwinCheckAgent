name: Release

# Push a version tag to publish a release that installed Windows agents update to:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/${{ github.repository }}
  VPK_VERSION: 1.2.161

jobs:
  windows:
    name: Windows installer and updates
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Read version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag must look like v1.2.3, got ${{ github.ref_name }}." }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install ExifTool for tests
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "exiftool"
          ./scripts/install-exiftool-win.ps1 -Destination $destination
          "TWINCHECK_EXIFTOOL_PATH=$(Join-Path $destination 'exiftool.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test
        run: dotnet test tests/TwinCheck.Agent.Tests/TwinCheck.Agent.Tests.csproj --configuration Release --nologo

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Download previous release for delta updates
        shell: pwsh
        run: |
          vpk download github --repoUrl $env:REPO_URL --token ${{ secrets.GITHUB_TOKEN }} -o artifacts/win-x64/releases
          if ($LASTEXITCODE -ne 0) { Write-Host "No previous release found; publishing full packages only." }
          $global:LASTEXITCODE = 0

      - name: Build installer
        shell: pwsh
        run: ./scripts/package-win.ps1 -PackageVersion $env:PACKAGE_VERSION

      - name: Publish GitHub release
        shell: pwsh
        run: |
          vpk upload github `
            --repoUrl $env:REPO_URL `
            --token ${{ secrets.GITHUB_TOKEN }} `
            --publish `
            --tag ${{ github.ref_name }} `
            --releaseName "TwinCheck Scan Agent $env:PACKAGE_VERSION" `
            --targetCommitish ${{ github.sha }} `
            -o artifacts/win-x64/releases
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed (exit code $LASTEXITCODE)." }

  nixos:
    name: NixOS package
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build NixOS package
        run: PACKAGE_VERSION="${GITHUB_REF_NAME#v}" ./scripts/package-nixos.sh

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/nixos/*.tar.gz --clobber
