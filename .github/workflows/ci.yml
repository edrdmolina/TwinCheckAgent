name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install ExifTool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Install ExifTool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool

      - name: Install ExifTool (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "exiftool"
          ./scripts/install-exiftool-win.ps1 -Destination $destination
          "TWINCHECK_EXIFTOOL_PATH=$(Join-Path $destination 'exiftool.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore TwinCheckAgent.sln

      - name: Build core
        run: dotnet build src/TwinCheck.Agent.Core/TwinCheck.Agent.Core.csproj --configuration Release --no-restore --nologo

      - name: Build API
        run: dotnet build src/TwinCheck.Agent.Api/TwinCheck.Agent.Api.csproj --configuration Release --no-restore --nologo

      - name: Build GUI
        run: dotnet build src/TwinCheck.Agent.Gui/TwinCheck.Agent.Gui.csproj --configuration Release --no-restore --nologo

      - name: Build tests
        run: dotnet build tests/TwinCheck.Agent.Tests/TwinCheck.Agent.Tests.csproj --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test tests/TwinCheck.Agent.Tests/TwinCheck.Agent.Tests.csproj --configuration Release --no-build --nologo --logger "trx;LogFileName=test-results.trx"

      - name: Verify HTTP SQLite lifecycle
        run: python tests/api/sqlite-lifecycle.py --api src/TwinCheck.Agent.Api/bin/Release/net9.0/TwinCheck.Agent.Api.dll

      - name: Verify HTTP metadata lifecycle
        run: python tests/api/metadata-lifecycle.py --api src/TwinCheck.Agent.Api/bin/Release/net9.0/TwinCheck.Agent.Api.dll

      - name: Validate NixOS installer lifecycle
        if: runner.os == 'Linux'
        run: bash tests/installers/nixos-lifecycle.sh

      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem packaging/windows/*.ps1, scripts/package-win.ps1, scripts/install-exiftool-win.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | Format-List
            }
          }
          if ($failed) { exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/TwinCheck.Agent.Tests/TestResults/*.trx
          if-no-files-found: ignore
